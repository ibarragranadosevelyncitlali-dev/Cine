<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinePremier - Cartelera de Cine</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-principal: #090d16;
      --bg-header: rgba(15, 23, 42, 0.85);
      --bg-tarjeta: #0f172a;
      --bg-hover: #1e293b;
      --color-primario: #e11d48;
      --color-primario-hover: #f43f5e;
      --texto-principal: #f8fafc;
      --texto-secundario: #94a3b8;
      --texto-mutado: #64748b;
      --borde-color: rgba(255, 255, 255, 0.08);
      --sombra: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      --fuente-base: 'Inter', sans-serif;
      --radio-borde: 14px;
      --transicion: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--fuente-base);
      background-color: var(--bg-principal);
      color: var(--texto-principal);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* CABECERA */
    .encabezado {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-header);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--borde-color);
    }

    .encabezado-contenido {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .logo-contenedor {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--texto-principal);
    }

    .logo-icono {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--color-primario), #f59e0b);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
    }

    .logo-texto {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* BUSCADOR */
    .buscador-contenedor {
      flex: 1;
      max-width: 420px;
      position: relative;
    }

    .buscador-input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.5rem;
      background-color: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--borde-color);
      border-radius: 10px;
      color: var(--texto-principal);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: var(--transicion);
    }

    .buscador-input:focus {
      border-color: var(--color-primario);
      background-color: var(--bg-hover);
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.2);
    }

    .buscador-icono {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--texto-secundario);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .badge-cartelera {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: rgba(30, 41, 59, 0.6);
      border: 1px solid var(--borde-color);
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--texto-secundario);
    }

    .punto-vivo {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    /* BANNER */
    .seccion-heroe {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.6) 0%, var(--bg-principal) 100%);
      border-bottom: 1px solid var(--borde-color);
      padding: 2.5rem 1.5rem;
    }

    .heroe-contenido {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .heroe-titulo {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.4rem;
    }

    .heroe-subtitulo {
      color: var(--texto-secundario);
      font-size: 0.95rem;
    }

    /* FILTROS */
    .filtros-genero {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn-filtro {
      background-color: var(--bg-tarjeta);
      border: 1px solid var(--borde-color);
      color: var(--texto-secundario);
      padding: 0.45rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transicion);
    }

    .btn-filtro:hover {
      background-color: var(--bg-hover);
      color: var(--texto-principal);
    }

    .btn-filtro.activo {
      background-color: var(--color-primario);
      color: white;
      border-color: var(--color-primario);
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
    }

    /* CARTELERA */
    .contenedor-principal {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      flex: 1;
    }

    .cartelera-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.75rem;
    }

    .pelicula-card {
      background-color: var(--bg-tarjeta);
      border: 1px solid var(--borde-color);
      border-radius: var(--radio-borde);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transicion);
    }

    .pelicula-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: var(--sombra);
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background-color: #1e293b;
      overflow: hidden;
    }

    .poster-imagen {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .pelicula-card:hover .poster-imagen {
      transform: scale(1.05);
    }

    .poster-sombra {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 50%, var(--bg-tarjeta) 100%);
    }

    .badge-clasificacion {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid var(--borde-color);
      color: var(--texto-principal);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .badge-rating {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid var(--borde-color);
      color: #fbbf24;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .poster-info-overlay {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
    }

    .pelicula-genero {
      color: var(--color-primario);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pelicula-titulo {
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pelicula-contenido {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
      justify-content: space-between;
    }

    .pelicula-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--texto-secundario);
    }

    .horarios-lista {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .badge-horario {
      background-color: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--borde-color);
      color: var(--texto-secundario);
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-family: monospace;
    }

    .btn-ver-mas {
      width: 100%;
      padding: 0.6rem;
      background-color: var(--bg-hover);
      border: 1px solid var(--borde-color);
      color: var(--texto-principal);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transicion);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .btn-ver-mas:hover {
      background-color: var(--color-primario);
      border-color: var(--color-primario);
      color: white;
    }

    /* SIN RESULTADOS */
    .sin-resultados {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--texto-secundario);
      grid-column: 1 / -1;
    }

    .sin-resultados-icono {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.activo {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-contenedor {
      background-color: var(--bg-tarjeta);
      border: 1px solid var(--borde-color);
      border-radius: 20px;
      max-width: 500px;
      width: 100%;
      max-height: 95vh;
      overflow-y: auto;
      transform: scale(0.92);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .modal-overlay.activo .modal-contenedor {
      transform: scale(1);
    }

    .modal-cabecera-poster {
      position: relative;
      height: 200px;
    }

    .modal-cabecera-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-overlay-gradiente {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, var(--bg-tarjeta) 0%, transparent 100%);
    }

    .btn-cerrar-modal {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-info-basica {
      position: absolute;
      bottom: 12px;
      left: 1.5rem;
      right: 1.5rem;
    }

    .modal-cuerpo {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .modal-meta-bar {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--texto-secundario);
      flex-wrap: wrap;
    }

    .modal-sinopsis {
      font-size: 0.9rem;
      color: var(--texto-secundario);
      line-height: 1.6;
    }

    .modal-seccion-horarios h4 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--texto-mutado);
      margin-bottom: 0.5rem;
    }

    .modal-horarios-grid {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn-horario {
      background-color: var(--bg-hover);
      border: 1px solid var(--borde-color);
      color: var(--texto-principal);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-family: monospace;
      cursor: pointer;
      transition: var(--transicion);
    }

    .btn-horario:hover,
    .btn-horario.seleccionado {
      background-color: var(--color-primario);
      border-color: var(--color-primario);
      color: white;
    }

    /* NUEVOS CONTROLES DE RESERVA */
    .opciones-reserva {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
    }

    .campo-reserva {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 0;
    }

    .campo-reserva label {
      color: var(--texto-secundario);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .campo-reserva input,
    .campo-reserva select {
      width: 100%;
      padding: 0.65rem 0.75rem;
      background: var(--bg-hover);
      border: 1px solid var(--borde-color);
      border-radius: 8px;
      color: var(--texto-principal);
      font: inherit;
      font-size: 0.85rem;
      outline: none;
    }

    .campo-reserva input:focus,
    .campo-reserva select:focus {
      border-color: var(--color-primario);
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.18);
    }

    .campo-reserva select option {
      background: var(--bg-tarjeta);
      color: var(--texto-principal);
    }

    .campo-reserva input::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: invert(1);
    }

    .btn-comprar {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--color-primario);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 12px;
      cursor: pointer;
      transition: var(--transicion);
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
    }

    .btn-comprar:hover {
      background-color: var(--color-primario-hover);
    }

    /* PIE DE PÁGINA */
    .pie-pagina {
      background-color: #050811;
      border-top: 1px solid var(--borde-color);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--texto-mutado);
    }

    .pie-pagina-contenido {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      .encabezado-contenido {
        flex-direction: column;
        align-items: stretch;
      }

      .badge-cartelera {
        display: none;
      }

      .heroe-contenido {
        flex-direction: column;
        align-items: flex-start;
      }

      .pie-pagina-contenido {
        flex-direction: column;
        justify-content: center;
      }
    }

    @media (max-width: 420px) {
      .opciones-reserva {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- CABECERA -->
  <header class="encabezado">
    <div class="encabezado-contenido">
      <a href="#" class="logo-contenedor">
        <div class="logo-icono">🍿</div>
        <span class="logo-texto">Cinepolis</span>
      </a>

      <div class="buscador-contenedor">
        <span class="buscador-icono">🔍</span>
        <input
          type="text"
          id="inputBuscador"
          class="buscador-input"
          placeholder="Buscar película..."
        >
      </div>

      <div class="badge-cartelera">
        <span class="punto-vivo"></span>
        <span>Cartelera Hoy</span>
      </div>
    </div>
  </header>

  <!-- BANNER -->
  <section class="seccion-heroe">
    <div class="heroe-contenido">
      <div>
        <h1 class="heroe-titulo">Películas en Cartelera</h1>
        <p class="heroe-subtitulo">
          Selecciona una película y reserva tus boletos al instante.
        </p>
      </div>

      <div id="contenedorFiltros" class="filtros-genero"></div>
    </div>
  </section>

  <!-- CARTELERA -->
  <main class="contenedor-principal">
    <div id="gridPeliculas" class="cartelera-grid"></div>
  </main>

  <!-- MODAL DE RESERVA -->
  <div id="modalPelicula" class="modal-overlay">
    <div class="modal-contenedor">

      <div class="modal-cabecera-poster">
        <img id="modalImagen" src="" alt="Póster">
        <div class="modal-overlay-gradiente"></div>

        <button id="btnCerrarModal" class="btn-cerrar-modal" type="button">
          &times;
        </button>

        <div class="modal-info-basica">
          <span id="modalGenero" class="pelicula-genero"></span>
          <h2 id="modalTitulo" class="pelicula-titulo" style="font-size: 1.4rem;"></h2>
        </div>
      </div>

      <div class="modal-cuerpo">

        <div class="modal-meta-bar">
          <span>⏱️ <strong id="modalDuracion" style="color: var(--texto-principal);"></strong></span>
          <span>⭐ <strong id="modalRating" style="color: #fbbf24;"></strong></span>
          <span>Clasif: <strong id="modalClasificacion" style="color: var(--texto-principal);"></strong></span>
        </div>

        <p id="modalSinopsis" class="modal-sinopsis"></p>

        <!-- SELECTORES DE FECHA, FORMATO E IDIOMA -->
        <div class="opciones-reserva">

          <div class="campo-reserva">
            <label for="fechaFuncion">Fecha de la función</label>
            <input type="date" id="fechaFuncion" required>
          </div>

          <div class="campo-reserva">
            <label for="tipoPelicula">Tipo de película</label>
            <select id="tipoPelicula" required>
              <option value="2D">2D</option>
              <option value="3D">3D</option>
              <option value="IMAX">IMAX</option>
              <option value="4D">4D</option>
            </select>
          </div>

          <div class="campo-reserva">
            <label for="idiomaPelicula">Idioma</label>
            <select id="idiomaPelicula" required>
              <option value="Original">Original</option>
              <option value="Doblado">Doblado</option>
              <option value="Subtitulado">Subtitulado</option>
            </select>
          </div>

        </div>

        <!-- HORARIOS -->
        <div class="modal-seccion-horarios">
          <h4>Selecciona un Horario</h4>
          <div id="modalHorarios" class="modal-horarios-grid"></div>
        </div>

        <button id="btnConfirmar" class="btn-comprar" type="button">
          Comprar Boletos
        </button>

      </div>
    </div>
  </div>

  <!-- PIE DE PÁGINA -->
  <footer class="pie-pagina">
    <div class="pie-pagina-contenido">
      <p>© 2026 CinePremier Demo - CSS Tradicional.</p>
      <p>Proyecto de Ejemplo para GitHub Pages</p>
    </div>
  </footer>

        poster: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&auto=format&fit=crop&q=80",
        horarios: ["11:30", "13:45", "16:00"]
      },
      {
        id: 6,
        titulo: "Misterio en el Expreso",
        genero: "Drama",
        duracion: "118 min",
        rating: "7.5",
        clasificacion: "B",
        sinopsis: "Durante una tormenta de nieve en el Transiberiano, un millonario es asesinado en su camarote. Un famoso detective a bordo debe interrogar a los 12 pasajeros bajo sospecha.",
        poster: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=500&auto=format&fit=crop&q=80",
        horarios: ["17:15", "19:50", "22:10"]
      },
      {
        id: 7,
        titulo: "Oppenheimer",
        genero: "Drama",
        duracion: "180 min",
        rating: "8.9",
        clasificacion: "B15",
        sinopsis: "La historia del físico teórico J. Robert Oppenheimer y su liderazgo en el Proyecto Manhattan durante la Segunda Guerra Mundial para desarrollar las primeras armas nucleares del mundo.",
        poster: "https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=500&auto=format&fit=crop&q=80",
        horarios: ["15:00", "18:50", "22:00"]
      },
      {
        id: 8,
        titulo: "Spider-Man: Across the Spider-Verse",
        genero: "Animación",
        duracion: "140 min",
        rating: "8.7",
        clasificacion: "A",
        sinopsis: "Miles Morales es transportado a través del Multiverso, donde se encuentra con un equipo de Spider-Personas encargadas de proteger su propia existencia ante una nueva amenaza destructiva.",
        poster: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&auto=format&fit=crop&q=80",
        horarios: ["12:00", "14:50", "17:40", "20:30"]
      },
      {
        id: 9,
        titulo: "Interstellar",
        genero: "Sci-Fi",
        duracion: "169 min",
        rating: "8.7",
        clasificacion: "B",
        sinopsis: "Un grupo de exploradores viaja a través de un agujero de gusano en el espacio en un intento desesperado por asegurar la supervivencia de la humanidad ante el colapso de la Tierra.",
        poster: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500&auto=format&fit=crop&q=80",
        horarios: ["16:00", "19:30", "22:30"]
      }
    ];

    // ESTADO LOCAL
    let generoSeleccionado = "Todos";
    let textoBusqueda = "";
    let horarioSeleccionado = "";

    // ELEMENTOS DEL DOM
    const gridPeliculas = document.getElementById("gridPeliculas");
    const contenedorFiltros = document.getElementById("contenedorFiltros");
    const inputBuscador = document.getElementById("inputBuscador");

    // ELEMENTOS DEL MODAL
    const modalPelicula = document.getElementById("modalPelicula");
    const btnCerrarModal = document.getElementById("btnCerrarModal");
    const modalImagen = document.getElementById("modalImagen");
    const modalTitulo = document.getElementById("modalTitulo");
    const modalGenero = document.getElementById("modalGenero");
    const modalDuracion = document.getElementById("modalDuracion");
    const modalRating = document.getElementById("modalRating");
    const modalClasificacion = document.getElementById("modalClasificacion");
    const modalSinopsis = document.getElementById("modalSinopsis");
    const modalHorarios = document.getElementById("modalHorarios");
    const btnConfirmar = document.getElementById("btnConfirmar");

    // NUEVOS CONTROLES
    const fechaFuncion = document.getElementById("fechaFuncion");
    const tipoPelicula = document.getElementById("tipoPelicula");
    const idiomaPelicula = document.getElementById("idiomaPelicula");

    // OBTENER FECHA LOCAL ACTUAL
    function obtenerFechaLocal() {
      const hoy = new Date();

      const anio = hoy.getFullYear();
      const mes = String(hoy.getMonth() + 1).padStart(2, "0");
      const dia = String(hoy.getDate()).padStart(2, "0");

      return `${anio}-${mes}-${dia}`;
    }

    const fechaActual = obtenerFechaLocal();

    fechaFuncion.min = fechaActual;
    fechaFuncion.value = fechaActual;

    // OBTENER GÉNEROS ÚNICOS
    const generos = [
      "Todos",
      ...new Set(peliculas.map(pelicula => pelicula.genero))
    ];

    // RENDERIZAR FILTROS
    function renderizarFiltros() {
      contenedorFiltros.innerHTML = generos.map(genero => `
        <button
          class="btn-filtro ${generoSeleccionado === genero ? 'activo' : ''}"
          onclick="filtrarPorGenero('${genero}')"
          type="button"
        >
          ${genero}
        </button>
      `).join("");
    }

    // FILTRAR POR GÉNERO
    window.filtrarPorGenero = function(genero) {
      generoSeleccionado = genero;
      renderizarFiltros();
      renderizarCartelera();
    };

    // RENDERIZAR CARTELERA
    function renderizarCartelera() {
      const filtradas = peliculas.filter(pelicula => {
        const coincideGenero =
          generoSeleccionado === "Todos" ||
          pelicula.genero === generoSeleccionado;

        const coincideBusqueda =
          pelicula.titulo.toLowerCase().includes(textoBusqueda.toLowerCase());

        return coincideGenero && coincideBusqueda;
      });

      if (filtradas.length === 0) {
        gridPeliculas.innerHTML = `
          <div class="sin-resultados">
            <div class="sin-resultados-icono">🎬</div>
            <h3>No se encontraron películas</h3>
            <p>Intenta buscando con otro término o género.</p>
          </div>
        `;
        return;
      }

      gridPeliculas.innerHTML = filtradas.map(pelicula => `
        <div class="pelicula-card">

          <div class="poster-wrapper">
            <img
              src="${pelicula.poster}"
              alt="${pelicula.titulo}"
              class="poster-imagen"
            >

            <div class="poster-sombra"></div>

            <span class="badge-clasificacion">
              ${pelicula.clasificacion}
            </span>

            <span class="badge-rating">
              ⭐ ${pelicula.rating}
            </span>

            <div class="poster-info-overlay">
              <span class="pelicula-genero">${pelicula.genero}</span>
              <h3 class="pelicula-titulo">${pelicula.titulo}</h3>
            </div>
          </div>

          <div class="pelicula-contenido">

            <div class="pelicula-meta">
              <span>⏱️ ${pelicula.duracion}</span>
              <span>Hoy</span>
            </div>

            <div class="horarios-lista">
              ${pelicula.horarios.map(horario => `
                <span class="badge-horario">${horario}</span>
              `).join("")}
            </div>

            <button
              class="btn-ver-mas"
              onclick="abrirModal(${pelicula.id})"
              type="button"
            >
              Ver detalles / Comprar
            </button>

          </div>
        </div>
      `).join("");
    }

    // ABRIR MODAL
    window.abrirModal = function(id) {
      const pelicula = peliculas.find(p => p.id === id);

      if (!pelicula) {
        return;
      }

      horarioSeleccionado = "";

      // Restablecer valores iniciales
      fechaFuncion.min = obtenerFechaLocal();
      fechaFuncion.value = obtenerFechaLocal();
      tipoPelicula.value = "2D";
      idiomaPelicula.value = "Original";

      // Mostrar información de la película
      modalImagen.src = pelicula.poster;
      modalTitulo.textContent = pelicula.titulo;
      modalGenero.textContent = pelicula.genero;
      modalDuracion.textContent = pelicula.duracion;
      modalRating.textContent = pelicula.rating;
      modalClasificacion.textContent = pelicula.clasificacion;
      modalSinopsis.textContent = pelicula.sinopsis;

      // Crear botones de horarios
      modalHorarios.innerHTML = pelicula.horarios.map(horario => `
        <button
          class="btn-horario"
          onclick="seleccionarHorario(this, '${horario}')"
          type="button"
        >
          ${horario}
        </button>
      `).join("");

      modalPelicula.classList.add("activo");
    };

    // SELECCIONAR HORARIO
    window.seleccionarHorario = function(boton, horario) {
      horarioSeleccionado = horario;

      document.querySelectorAll(".btn-horario").forEach(botonHorario => {
        botonHorario.classList.remove("seleccionado");
      });

      boton.classList.add("seleccionado");
    };

    // CERRAR MODAL
    function cerrarModal() {
      modalPelicula.classList.remove("activo");
    }

    // EVENTO DEL BUSCADOR
    inputBuscador.addEventListener("input", function(evento) {
      textoBusqueda = evento.target.value;
      renderizarCartelera();
    });

    // CERRAR CON EL BOTÓN
    btnCerrarModal.addEventListener("click", cerrarModal);

    // CERRAR AL HACER CLIC FUERA DEL MODAL
    modalPelicula.addEventListener("click", function(evento) {
      if (evento.target === modalPelicula) {
        cerrarModal();
      }
    });

    // CONFIRMAR COMPRA
    btnConfirmar.addEventListener("click", function() {

      const fechaSeleccionada = fechaFuncion.value;
      const fechaMinima = obtenerFechaLocal();

      // Validar fecha
      if (!fechaSeleccionada) {
        alert("Por favor selecciona la fecha de la función.");
        fechaFuncion.focus();
        return;
      }

      if (fechaSeleccionada < fechaMinima) {
        alert("La fecha de la función no puede ser anterior a hoy.");
        fechaFuncion.focus();
        return;
      }

      // Validar horario
      if (!horarioSeleccionado) {
        alert("Por favor selecciona un horario para tu función.");
        return;
      }

      // Formatear fecha
      const fechaFormateada = new Date(
        fechaSeleccionada + "T00:00:00"
      ).toLocaleDateString("es-MX", {
        day: "2-digit",
        month: "long",
        year: "numeric"
      });

      // Mostrar confirmación
      alert(
        "¡Boletos reservados con éxito!\n\n" +
        "Película: " + modalTitulo.textContent + "\n" +
        "Fecha: " + fechaFormateada + "\n" +
        "Hora: " + horarioSeleccionado + "\n" +
        "Formato: " + tipoPelicula.value + "\n" +
        "Idioma: " + idiomaPelicula.value
      );

      cerrarModal();
    });

    // INICIALIZAR APLICACIÓN
    renderizarFiltros();
    renderizarCartelera();

  </script>
</body>
</html>
